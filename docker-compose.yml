services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aurelia-pg
    environment:
      POSTGRES_USER: aurelia
      POSTGRES_PASSWORD: local
      POSTGRES_DB: aurelia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurelia -d aurelia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
