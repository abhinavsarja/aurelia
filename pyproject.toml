[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurelia"
version = "0.1.0"
description = "AURELIA — retail trading performance Q&A backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "openai>=1.54",
    "chainlit>=1.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["asyncpg>=0.29"]

[tool.setuptools.packages.find]
include = ["aurelia*"]

[tool.pyright]
include = ["aurelia", "tests", "scripts"]
extraPaths = ["."]
pythonVersion = "3.11"
typeCheckingMode = "basic"
